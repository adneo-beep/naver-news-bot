<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네이버 뉴스 검색</title>
  <meta name="description" content="네이버 오픈API를 활용한 최신 뉴스 검색 서비스" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f1a;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.1);
      --text: #f0f2ff;
      --text-sub: rgba(240,242,255,0.55);
      --accent: #00e676;
      --accent-glow: rgba(0,230,118,0.25);
      --accent2: #00b0ff;
      --tg: #229ED9;
      --tg-glow: rgba(34,158,217,0.3);
      --danger: #ff5370;
      --radius: 16px;
      --card-radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0,230,118,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(0,176,255,0.07) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,15,26,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 18px 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .logo-text { color: var(--text); }
    .logo-text span { color: var(--accent); }

    .tg-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: rgba(34,158,217,0.12);
      border: 1.5px solid rgba(34,158,217,0.35);
      border-radius: 50px;
      color: var(--tg);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tg-btn:hover {
      background: rgba(34,158,217,0.22);
      box-shadow: 0 4px 16px var(--tg-glow);
    }
    .tg-btn.active {
      background: var(--tg);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 16px var(--tg-glow);
    }
    .tg-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* Search bar */
    .search-row { display: flex; gap: 10px; }

    .search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      padding: 0 18px;
      gap: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon { font-size: 16px; opacity: 0.5; }

    .search-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15px;
      font-family: inherit;
      padding: 13px 0;
      outline: none;
      color: var(--text);
    }

    .search-wrap input::placeholder { color: var(--text-sub); }

    .clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-sub);
      font-size: 16px;
      padding: 4px;
      display: none;
      transition: color 0.15s;
    }
    .clear-btn:hover { color: var(--text); }
    .clear-btn.show { display: block; }

    .search-btn {
      padding: 13px 26px;
      background: linear-gradient(135deg, var(--accent), #00c853);
      color: #001a0d;
      border: none;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
      white-space: nowrap;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .search-btn:hover { opacity: 0.9; box-shadow: 0 6px 24px var(--accent-glow); }
    .search-btn:active { transform: scale(0.97); }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sort-group {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .sort-group button {
      padding: 6px 16px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      color: var(--text-sub);
      font-weight: 500;
      transition: all 0.15s;
    }
    .sort-group button.active {
      background: linear-gradient(135deg, var(--accent), #00c853);
      color: #001a0d;
      font-weight: 700;
    }

    .display-select {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    .display-select option { background: #1a1d2e; }

    .result-count {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-sub);
    }

    /* ===== Telegram Panel ===== */
    .tg-panel {
      display: none;
      background: rgba(34,158,217,0.06);
      border: 1px solid rgba(34,158,217,0.2);
      border-radius: var(--radius);
      padding: 20px;
      margin: 12px 0 0;
      animation: slideDown 0.2s ease;
    }
    .tg-panel.open { display: block; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tg-panel h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--tg);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tg-fields { display: flex; flex-direction: column; gap: 12px; }

    .tg-field label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tg-field input, .tg-field textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .tg-field input:focus, .tg-field textarea:focus {
      border-color: var(--tg);
      box-shadow: 0 0 0 3px var(--tg-glow);
    }
    .tg-field textarea { resize: vertical; min-height: 60px; }
    .tg-field .hint {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--text-sub);
      line-height: 1.5;
    }
    .tg-field .hint a { color: var(--tg); text-decoration: none; }
    .tg-field .hint a:hover { text-decoration: underline; }

    .tg-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .tg-toggle-label { font-size: 14px; font-weight: 600; }
    .tg-toggle-desc { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.15);
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--tg); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }

    .tg-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-save {
      flex: 1;
      padding: 11px 20px;
      background: var(--tg);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 12px var(--tg-glow);
    }
    .btn-save:hover { opacity: 0.9; box-shadow: 0 6px 20px var(--tg-glow); }

    .btn-test {
      padding: 11px 20px;
      background: transparent;
      border: 1.5px solid var(--tg);
      border-radius: 10px;
      color: var(--tg);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-test:hover { background: rgba(34,158,217,0.1); }
    .btn-test:disabled { opacity: 0.4; cursor: not-allowed; }

    .tg-status {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      display: none;
    }
    .tg-status.ok { background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.3); color: var(--accent); }
    .tg-status.err { background: rgba(255,83,112,0.1); border: 1px solid rgba(255,83,112,0.3); color: var(--danger); }
    .tg-status.show { display: block; }

    .tg-next-run {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      margin-top: 4px;
    }

    /* Main */
    main {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    /* State boxes */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 100px 20px;
      color: var(--text-sub);
      font-size: 15px;
      text-align: center;
    }
    .state-box .icon { font-size: 56px; filter: grayscale(0.3); }
    .state-box p { max-width: 280px; line-height: 1.6; }

    .error-box {
      background: rgba(255,83,112,0.1);
      border: 1px solid rgba(255,83,112,0.3);
      border-radius: var(--radius);
      padding: 16px 20px;
      color: var(--danger);
      font-size: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    /* News list */
    .news-list { display: flex; flex-direction: column; gap: 14px; }

    .news-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 22px 24px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .news-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-glow), transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .news-card:hover {
      background: var(--surface-hover);
      border-color: rgba(0,230,118,0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .news-card:hover::before { opacity: 1; }

    .news-card a {
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
    }

    .news-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 8px;
    }
    .news-title mark {
      background: rgba(0,230,118,0.2);
      color: var(--accent);
      border-radius: 4px;
      padding: 0 3px;
    }

    .news-desc {
      font-size: 13.5px;
      color: var(--text-sub);
      line-height: 1.65;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-desc mark {
      background: rgba(0,230,118,0.15);
      color: var(--accent);
      border-radius: 3px;
      padding: 0 2px;
    }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .news-source {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      background: rgba(0,230,118,0.1);
      border: 1px solid rgba(0,230,118,0.2);
      border-radius: 20px;
      font-weight: 600;
      color: var(--accent);
      font-size: 11.5px;
    }

    .news-date { margin-left: auto; }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 36px;
      padding-bottom: 48px;
    }

    .pagination button {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text-sub);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pagination button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,230,118,0.08);
    }
    .pagination button.active {
      background: linear-gradient(135deg, var(--accent), #00c853);
      border-color: transparent;
      color: #001a0d;
      font-weight: 700;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .pagination button:disabled { opacity: 0.25; cursor: not-allowed; }

    /* Loader */
    .loader { display: flex; justify-content: center; padding: 80px 0; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .news-card { animation: fadeUp 0.3s ease both; }

    @media (max-width: 560px) {
      .logo { font-size: 18px; }
      .search-btn { padding: 12px 18px; font-size: 13px; }
      .news-card { padding: 18px; }
      .news-title { font-size: 15px; }
      .result-count { display: none; }
      .tg-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">📰</div>
        <div class="logo-text">네이버 <span>뉴스</span> 검색</div>
      </div>
      <button class="tg-btn" id="tgToggleBtn" onclick="toggleTgPanel()">
        <span>✈️</span>
        <span id="tgBtnLabel">텔레그램 설정</span>
        <span class="tg-dot" id="tgDot" style="display:none"></span>
      </button>
    </div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="검색어를 입력하세요" autocomplete="off" />
        <button class="clear-btn" id="clearBtn" title="지우기">✕</button>
      </div>
      <button class="search-btn" id="searchBtn" onclick="search()">검색</button>
    </div>
    <div class="controls" id="controls" style="display:none">
      <div class="sort-group">
        <button id="sortDate" class="active" onclick="setSort('date')">최신순</button>
        <button id="sortSim" onclick="setSort('sim')">관련순</button>
      </div>
      <select class="display-select" id="displaySelect" onchange="search()">
        <option value="10">10개씩</option>
        <option value="20">20개씩</option>
        <option value="30">30개씩</option>
      </select>
      <span class="result-count" id="resultCount"></span>
    </div>

    <!-- Telegram Panel -->
    <div class="tg-panel" id="tgPanel">
      <h3>✈️ 텔레그램 자동 전송 설정</h3>
      <div class="tg-fields">

        <div class="tg-field">
          <label>Bot Token</label>
          <input type="password" id="tgToken" placeholder="123456789:AAFxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
          <div class="hint">
            <a href="https://t.me/BotFather" target="_blank">@BotFather</a>에서 봇을 만들고 토큰을 복사하세요.
          </div>
        </div>

        <div class="tg-field">
          <label>Chat ID</label>
          <input type="text" id="tgChatId" placeholder="-100xxxxxxxxxx 또는 @채널명" autocomplete="off" />
          <div class="hint">
            개인 DM: <a href="https://t.me/userinfobot" target="_blank">@userinfobot</a>에서 확인 &nbsp;|&nbsp;
            채널: @채널명 또는 숫자 ID
          </div>
        </div>

        <div class="tg-field">
          <label>검색 키워드 (쉼표로 구분)</label>
          <textarea id="tgKeywords" placeholder="예: 인공지능, 테슬라, 코스피"></textarea>
          <div class="hint">각 키워드마다 상위 5개 뉴스를 2시간마다 전송합니다.</div>
        </div>

        <div class="tg-toggle-row">
          <div>
            <div class="tg-toggle-label">자동 전송 활성화</div>
            <div class="tg-toggle-desc">2시간마다 설정된 키워드 뉴스를 자동으로 전송합니다</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="tgEnabled" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="tg-status" id="tgStatus"></div>

        <div class="tg-actions">
          <button class="btn-save" onclick="saveTgConfig()">💾 설정 저장</button>
          <button class="btn-test" id="testBtn" onclick="testTelegram()">▶ 지금 전송 테스트</button>
        </div>

        <div class="tg-next-run" id="nextRun"></div>
      </div>
    </div>
  </div>
</header>

<main id="main">
  <div class="state-box">
    <div class="icon">🔍</div>
    <p>키워드를 입력하고<br>최신 뉴스를 검색해보세요</p>
  </div>
</main>

<script>
  let currentQuery = '';
  let currentSort = 'date';
  let currentPage = 1;
  let totalResults = 0;

  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const mainEl = document.getElementById('main');
  const controls = document.getElementById('controls');
  const resultCount = document.getElementById('resultCount');

  searchInput.addEventListener('input', () => {
    clearBtn.classList.toggle('show', searchInput.value.length > 0);
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.classList.remove('show');
    searchInput.focus();
  });

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') search();
  });

  function setSort(sort) {
    currentSort = sort;
    document.getElementById('sortDate').classList.toggle('active', sort === 'date');
    document.getElementById('sortSim').classList.toggle('active', sort === 'sim');
    if (currentQuery) { currentPage = 1; fetchNews(); }
  }

  function search() {
    const q = searchInput.value.trim();
    if (!q) { searchInput.focus(); return; }
    currentQuery = q;
    currentPage = 1;
    fetchNews();
  }

  async function fetchNews() {
    const display = parseInt(document.getElementById('displaySelect').value);
    const start = (currentPage - 1) * display + 1;

    mainEl.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    controls.style.display = 'none';

    try {
      const res = await fetch(`/api/news?query=${encodeURIComponent(currentQuery)}&sort=${currentSort}&start=${start}&display=${display}`);
      const data = await res.json();

      if (!res.ok) {
        mainEl.innerHTML = `<div class="error-box">⚠️ ${data.error}</div>`;
        return;
      }

      totalResults = data.total;
      renderResults(data.items, display);
      controls.style.display = 'flex';
      resultCount.textContent = `약 ${totalResults.toLocaleString()}건`;

    } catch (e) {
      mainEl.innerHTML = `<div class="error-box">⚠️ 서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해주세요.</div>`;
    }
  }

  function stripHtml(html) {
    return html
      .replace(/<[^>]*>/g, '')
      .replace(/&quot;/g, '"')
      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&#0*39;/g, "'");
  }

  function highlightQuery(text, query) {
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
  }

  function formatDate(pubDate) {
    const d = new Date(pubDate);
    const now = new Date();
    const diff = Math.floor((now - d) / 1000);
    if (diff < 60) return '방금 전';
    if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
    if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}일 전`;
    return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
  }

  function getSource(link) {
    try {
      const host = new URL(link).hostname.replace('www.', '');
      const known = {
        'news.naver.com': '네이버뉴스', 'chosun.com': '조선일보',
        'joongang.co.kr': '중앙일보', 'donga.com': '동아일보',
        'hani.co.kr': '한겨레', 'kmib.co.kr': '국민일보',
        'mk.co.kr': '매일경제', 'hankyung.com': '한국경제',
        'sedaily.com': '서울경제', 'yna.co.kr': '연합뉴스',
        'newsis.com': '뉴시스', 'news1.kr': '뉴스1',
        'ytn.co.kr': 'YTN', 'kbs.co.kr': 'KBS',
        'mbc.co.kr': 'MBC', 'sbs.co.kr': 'SBS',
      };
      return Object.entries(known).find(([k]) => host.includes(k))?.[1] || host.split('.')[0];
    } catch { return '뉴스'; }
  }

  function renderResults(items, display) {
    if (!items || items.length === 0) {
      mainEl.innerHTML = `<div class="state-box"><div class="icon">🗞️</div><p>검색 결과가 없습니다.<br>"${currentQuery}"와 관련된 뉴스를 찾지 못했어요.</p></div>`;
      return;
    }

    const cards = items.map((item, i) => {
      const title = highlightQuery(stripHtml(item.title), currentQuery);
      const desc = highlightQuery(stripHtml(item.description), currentQuery);
      const source = getSource(item.originallink || item.link);
      const date = formatDate(item.pubDate);

      return `
        <div class="news-card" style="animation-delay:${i * 0.04}s">
          <a href="${item.originallink || item.link}" target="_blank" rel="noopener noreferrer">
            <div class="news-title">${title}</div>
            <div class="news-desc">${desc}</div>
            <div class="news-meta">
              <span class="news-source">📰 ${source}</span>
              <span class="news-date">${date}</span>
            </div>
          </a>
        </div>`;
    }).join('');

    const totalPages = Math.min(Math.ceil(totalResults / display), 10);
    const pagination = buildPagination(totalPages);

    mainEl.innerHTML = `<div class="news-list">${cards}</div>${pagination}`;
  }

  function buildPagination(totalPages) {
    if (totalPages <= 1) return '';
    let html = '<div class="pagination">';
    html += `<button onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} title="이전">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (totalPages > 7 && Math.abs(i - currentPage) > 2 && i !== 1 && i !== totalPages) {
        if (i === currentPage - 3 || i === currentPage + 3) html += `<button disabled>…</button>`;
        continue;
      }
      html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `<button onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} title="다음">›</button>`;
    html += '</div>';
    return html;
  }

  function goPage(page) {
    if (page < 1) return;
    currentPage = page;
    fetchNews();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ===== Telegram Panel =====
  let tgPanelOpen = false;

  function toggleTgPanel() {
    tgPanelOpen = !tgPanelOpen;
    document.getElementById('tgPanel').classList.toggle('open', tgPanelOpen);
    document.getElementById('tgToggleBtn').classList.toggle('active', tgPanelOpen);
    if (tgPanelOpen) loadTgConfig();
  }

  async function loadTgConfig() {
    try {
      const res = await fetch('/api/telegram/config');
      const cfg = await res.json();
      if (cfg.botTokenSet) document.getElementById('tgToken').placeholder = '••••••• (저장됨 — 변경시 입력)';
      document.getElementById('tgChatId').value = cfg.chatId || '';
      document.getElementById('tgKeywords').value = (cfg.keywords || []).join(', ');
      document.getElementById('tgEnabled').checked = cfg.enabled;
      updateTgStatus(cfg.enabled);

      if (cfg.enabled) {
        const r2 = await fetch('/api/telegram/next-run');
        const d = await r2.json();
        document.getElementById('nextRun').textContent = `다음 전송 예정: ${d.nextRun}`;
      } else {
        document.getElementById('nextRun').textContent = '';
      }
    } catch (e) {
      console.error(e);
    }
  }

  function updateTgStatus(enabled) {
    const dot = document.getElementById('tgDot');
    const label = document.getElementById('tgBtnLabel');
    dot.style.display = enabled ? 'block' : 'none';
    label.textContent = enabled ? '텔레그램 ON' : '텔레그램 설정';
  }

  async function saveTgConfig() {
    const tokenInput = document.getElementById('tgToken').value.trim();
    const chatId = document.getElementById('tgChatId').value.trim();
    const keywordsRaw = document.getElementById('tgKeywords').value;
    const keywords = keywordsRaw.split(',').map(k => k.trim()).filter(Boolean);
    const enabled = document.getElementById('tgEnabled').checked;

    const body = { chatId, keywords, enabled };
    if (tokenInput) body.botToken = tokenInput;

    try {
      const res = await fetch('/api/telegram/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      showTgStatus(data.ok ? 'ok' : 'err', data.message || data.error);
      updateTgStatus(enabled);
      if (enabled) {
        const r2 = await fetch('/api/telegram/next-run');
        const d = await r2.json();
        document.getElementById('nextRun').textContent = `다음 전송 예정: ${d.nextRun}`;
      } else {
        document.getElementById('nextRun').textContent = '';
      }
    } catch (e) {
      showTgStatus('err', '저장 중 오류가 발생했습니다.');
    }
  }

  async function testTelegram() {
    const btn = document.getElementById('testBtn');
    btn.disabled = true;
    btn.textContent = '전송 중...';
    showTgStatus('', '');
    try {
      const res = await fetch('/api/telegram/test', { method: 'POST' });
      const data = await res.json();
      showTgStatus(res.ok ? 'ok' : 'err', data.message || data.error);
    } catch (e) {
      showTgStatus('err', '전송 실패: 서버 오류');
    } finally {
      btn.disabled = false;
      btn.textContent = '▶ 지금 전송 테스트';
    }
  }

  function showTgStatus(type, msg) {
    const el = document.getElementById('tgStatus');
    el.className = 'tg-status';
    if (!type || !msg) { el.textContent = ''; return; }
    el.classList.add('show', type);
    el.textContent = type === 'ok' ? '✅ ' + msg : '❌ ' + msg;
  }
</script>
</body>
</html>
